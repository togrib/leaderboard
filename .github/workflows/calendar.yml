# Runs fetch_calendar.py automatically so the dashboard calendar stays fresh.
# This file must live at:  .github/workflows/calendar.yml  (top level of the repo,
# NOT inside the docs folder).

name: Update calendar

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # also adds a "Run workflow" button on the Actions tab

# Lets this job save changes back to your repo
permissions:
  contents: write

# If a run is already going, make the next one wait instead of running at the
# same time (two overlapping runs can collide when they try to save).
concurrency:
  group: calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get a copy of the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calendar libraries
        run: pip install icalendar recurring-ical-events

      - name: Fetch the calendar and write docs/calendar.json
        run: python fetch_calendar.py

      - name: Save calendar.json if it changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"

          # Keep a copy of the fresh calendar file we just made
          cp docs/calendar.json "$RUNNER_TEMP/calendar.json"

          # Try up to 5 times, because someone else may push at the same moment.
          for attempt in 1 2 3 4 5; do
            # Jump to the very latest version of the repo...
            git fetch origin main
            git reset --hard origin/main
            # ...and put our fresh calendar file on top of it
            cp "$RUNNER_TEMP/calendar.json" docs/calendar.json
            git add docs/calendar.json

            if git diff --cached --quiet; then
              echo "Calendar unchanged. Nothing to save."
              exit 0
            fi

            git commit -m "Update calendar"
            if git push origin HEAD:main; then
              echo "Saved on attempt $attempt."
              exit 0
            fi
            echo "Push was rejected (attempt $attempt). Trying again..."
            sleep 5
          done

          echo "Could not save after 5 attempts."
          exit 1
