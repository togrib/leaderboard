<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="300">
<title>AP Precalculus 2 - Homework Completion Leaderboard</title>
<style>
    /* --- COLORS: change these hex codes to change the whole page's theme --- */
    :root {
        --bg-color: #0f172a;        /* page background */
        --text-color: #f1f5f9;      /* main text color */
        --row-bg: #1e293b;          /* background of each section's row */
        --rank-color: #94a3b8;      /* the "#1", "#2" etc. text */
        --bar-track-color: #334155; /* the empty (unfilled) part of the bar */
        --bar-fill-start: #22d3ee;  /* bar color, left end of gradient */
        --bar-fill-end: #3b82f6;    /* bar color, right end of gradient */
    }

    /* Using vw ("viewport width") and vh ("viewport height") instead of
       fixed px/rem values means every size below is a PERCENTAGE of the
       actual screen the page is shown on -- so the whole layout grows or
       shrinks automatically to fill whatever monitor the kiosk uses,
       instead of looking tiny (or overflowing) on a different screen size
       than what this was designed on. */
    body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 3vh 3vw;
    }
    h1 {
        text-align: center;
        font-size: 4vw;
        margin-bottom: 3vh;
    }
    ul {
        list-style: none;
        margin: 0 auto;
        padding: 0;
        max-width: 90vw;
    }
    .row {
        display: flex;
        align-items: center;
        gap: 2vw;
        padding: 2vh 2vw;
        margin-bottom: 1.5vh;
        background: var(--row-bg);
        border-radius: 12px;
        font-size: 2.2vw;
    }
    .rank {
        width: 4vw;
        font-weight: bold;
        color: var(--rank-color);
    }
    .name {
        width: 16vw;
        font-weight: 600;
    }
    .bar-track {
        flex-grow: 1;
        background: var(--bar-track-color);
        border-radius: 8px;
        overflow: hidden;
        height: 4vh;
    }
    .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--bar-fill-start), var(--bar-fill-end));
    }
    .percentage {
        width: 6vw;
        text-align: right;
        font-weight: bold;
    }
</style>
</head>
<body>
    <h1>AP Precalculus 2 - Homework Completion Leaderboard</h1>
    <ul>
        
            <li class="row">
                <span class="rank">#1</span>
                <span class="name">Period 2</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 12.12%;"></div>
                </div>
                <span class="percentage">12.12%</span>
            </li>
            

            <li class="row">
                <span class="rank">#2</span>
                <span class="name">Period 3</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 9.45%;"></div>
                </div>
                <span class="percentage">9.45%</span>
            </li>
            

            <li class="row">
                <span class="rank">#3</span>
                <span class="name">Period 5</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 7.91%;"></div>
                </div>
                <span class="percentage">7.91%</span>
            </li>
            

            <li class="row">
                <span class="rank">#4</span>
                <span class="name">Period 6</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 6.34%;"></div>
                </div>
                <span class="percentage">6.34%</span>
            </li>
            

            <li class="row">
                <span class="rank">#5</span>
                <span class="name">Period 4</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 5.4%;"></div>
                </div>
                <span class="percentage">5.4%</span>
            </li>
            
    </ul>
</body>
</html>
