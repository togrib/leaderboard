<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="300">
<title>AP Precalculus 2 - Homework Completion Leaderboard</title>
<style>
    body {
        background: #0f172a;
        color: #f1f5f9;
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 40px;
    }
    h1 {
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 40px;
    }
    ul {
        list-style: none;
        margin: 0 auto;
        padding: 0;
        max-width: 900px;
    }
    .row {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 18px 24px;
        margin-bottom: 14px;
        background: #1e293b;
        border-radius: 12px;
        font-size: 1.4rem;
    }
    .rank {
        width: 50px;
        font-weight: bold;
        color: #94a3b8;
    }
    .name {
        width: 220px;
        font-weight: 600;
    }
    .bar-track {
        flex-grow: 1;
        background: #334155;
        border-radius: 8px;
        overflow: hidden;
        height: 24px;
    }
    .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #22d3ee, #3b82f6);
    }
    .percentage {
        width: 80px;
        text-align: right;
        font-weight: bold;
    }
</style>
</head>
<body>
    <h1>AP Precalculus 2 - Homework Completion Leaderboard</h1>
    <ul>
        
            <li class="row">
                <span class="rank">#1</span>
                <span class="name">Period 2</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 12.12%;"></div>
                </div>
                <span class="percentage">12.12%</span>
            </li>
            

            <li class="row">
                <span class="rank">#2</span>
                <span class="name">Period 3</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 9.45%;"></div>
                </div>
                <span class="percentage">9.45%</span>
            </li>
            

            <li class="row">
                <span class="rank">#3</span>
                <span class="name">Period 5</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 7.91%;"></div>
                </div>
                <span class="percentage">7.91%</span>
            </li>
            

            <li class="row">
                <span class="rank">#4</span>
                <span class="name">Period 6</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 6.34%;"></div>
                </div>
                <span class="percentage">6.34%</span>
            </li>
            

            <li class="row">
                <span class="rank">#5</span>
                <span class="name">Period 4</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 5.4%;"></div>
                </div>
                <span class="percentage">5.4%</span>
            </li>
            
    </ul>
</body>
</html>
