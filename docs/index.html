<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom Dashboard</title>

  <!-- Shared colors and fonts -->
  <link rel="stylesheet" href="theme.css">

  <style>
    /* ---------- LAYOUT (rarely needs changing) ---------- */

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;           /* no scrollbars on a wall TV */
    }

    /* #dashboard holds the two columns side by side */
    #dashboard {
      display: flex;
      height: 100vh;
      padding: var(--gap);
      gap: var(--gap);
    }

    /* Each column stacks its panels top to bottom */
    .column {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      min-width: 0;
    }

    /* Embedded pages (leaderboard, chart, announcements) fill their panel */
    .panel iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ---------- CLOCK PANEL ---------- */

    .clock {
      padding: var(--pad);
      text-align: left;
    }
    .clock .time {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: var(--text-huge);
      line-height: 1;
      color: var(--gold);
    }
    .clock .date {
      font-size: var(--text-body);
      color: var(--muted);
      margin-top: 8px;
    }

  </style>
</head>

<body>

  <!-- The empty boxes below get filled in by the JavaScript at the bottom -->
  <div id="dashboard">
    <div class="column" id="col-left">
      <section class="panel" id="left_top"></section>
      <section class="panel" id="left_middle"></section>
      <section class="panel" id="left_bottom"></section>
    </div>

    <div class="column" id="col-right">
      <section class="panel" id="right_top"></section>
      <section class="panel" id="right_bottom"></section>
    </div>
  </div>

  <script>
    /* ==========================================================
       CONFIG BLOCK  -  this is the part you edit
       ========================================================== */

    // How wide each column is (should add up to about 100%)
    const LAYOUT = {
      left:  { width: "30%" },
      right: { width: "70%" }
    };

    // What goes in each panel.
    //   type: "clock"    -> built-in clock and date
    //   type: "iframe"   -> shows another page; "src" is the file name
    //   grow: how much vertical space the panel gets compared to the
    //         others in its column (2 = twice as tall as 1).
    //         Leave grow out for the clock (it sizes itself).
    const PANELS = {
      left_top:     { type: "clock" },
      left_middle:  { type: "iframe",   src: "calendar.html",      grow: 3 },
      left_bottom:  { type: "iframe",   src: "announcements.html", grow: 3 },
      right_top:    { type: "iframe",   src: "leaderboard.html",   grow: 1 },
      right_bottom: { type: "iframe",   src: "chart.html",         grow: 1 }
    };

    // Automatic refreshing, so updates you push to GitHub show up on their own
    const REFRESH = {
      iframeMinutes: 5,    // reload the embedded pages this often
      pageMinutes:   60    // reload this whole page this often
    };

    /* ==========================================================
       CODE BELOW  -  you shouldn't need to change this
       ========================================================== */

    // ---- 1. Set the column widths ----
    // "0 1 30%" means: don't grow, may shrink a little (to make room
    // for the gap between columns), start at 30% wide.
    document.getElementById("col-left").style.flex  = "0 1 " + LAYOUT.left.width;
    document.getElementById("col-right").style.flex = "0 1 " + LAYOUT.right.width;

    // We keep a list of every iframe so we can refresh them later
    const allIframes = [];

    // ---- 2. Functions that draw each type of panel ----

    // Clock: shows the time and date, updates every second
    function drawClock(panel) {
      panel.classList.add("clock");
      panel.innerHTML = '<div class="time"></div><div class="date"></div>';
      const timeEl = panel.querySelector(".time");
      const dateEl = panel.querySelector(".date");

      function tick() {
        const now = new Date();
        // Example output: "8:05 AM"
        timeEl.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        // Example output: "Monday, October 5"
        dateEl.textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
      }

      tick();                    // draw once right away
      setInterval(tick, 1000);   // then redraw every 1000 milliseconds (1 second)
    }

    // Iframe: embeds another page from this repo
    function drawIframe(panel, src) {
      const frame = document.createElement("iframe");
      frame.src = src;
      panel.appendChild(frame);
      allIframes.push({ frame: frame, src: src });
    }

    // ---- 3. Go through the PANELS config and draw each panel ----
    for (const id in PANELS) {
      const config = PANELS[id];
      const panel = document.getElementById(id);

      // Set the panel's height share (clock has no "grow", so it sizes itself)
      if (config.grow) {
        panel.style.flex = config.grow + " 1 0";
      } else {
        panel.style.flex = "0 0 auto";
      }

      if (config.type === "clock")    drawClock(panel);
      if (config.type === "iframe")   drawIframe(panel, config.src);
    }

    // ---- 4. Automatic refreshing ----

    // Reload each iframe. Adding "?t=<number>" to the address tricks the
    // browser into fetching a fresh copy instead of using its saved one.
    setInterval(function () {
      for (const item of allIframes) {
        item.frame.src = item.src + "?t=" + Date.now();
      }
    }, REFRESH.iframeMinutes * 60 * 1000);

    // Reload the whole dashboard (picks up changes to index.html and theme.css)
    setInterval(function () {
      location.reload();
    }, REFRESH.pageMinutes * 60 * 1000);
  </script>

</body>
</html>
