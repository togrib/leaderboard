<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="300">
<title>AP Precalc - CYUP Leaderboard</title>
<style>
    :root {
        --bg-color: #0f172a;
        --text-color: #f1f5f9;
        --row-bg: #1e293b;
        --rank-color: #94a3b8;
        --bar-track-color: #334155;
        --bar-fill-start: #22d3ee;
        --bar-fill-end: #3b82f6;
    }
    body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 2vh 3vw;
    }
    h1 {
        text-align: center;
        font-size: 4vw;
        margin-bottom: 1.5vh;
    }
    ul {
        list-style: none;
        margin: 0 auto;
        padding: 0;
        max-width: 94vw;
    }
    .row {
        display: flex;
        flex-direction: column;
        gap: 1vh;
        padding: 1.8vh 2.5vw;
        margin-bottom: 1.5vh;
        background: var(--row-bg);
        border-radius: 16px;
    }
    .top-line {
        display: flex;
        align-items: baseline;
        gap: 1.5vw;
    }
    .rank {
        font-size: 3vw;
        font-weight: bold;
        color: var(--rank-color);
    }
    .name {
        flex-grow: 1;
        font-size: 4.2vw;
        font-weight: 700;
        line-height: 1.05;
    }
    .percentage {
        font-size: 3.6vw;
        font-weight: bold;
    }
    .bar-track {
        background: var(--bar-track-color);
        border-radius: 10px;
        overflow: hidden;
        height: 3.5vh;
    }
    .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--bar-fill-start), var(--bar-fill-end));
    }
    .last-updated {
        text-align: center;
        margin-top: 1vh;
        font-size: 1.2vw;
        color: var(--rank-color);
    }
</style>
</head>
<body>
    <h1>AP Precalc - CYUP Leaderboard</h1>
    <ul>
        
            <li class="row">
                <div class="top-line">
                    <span class="rank">#1</span>
                    <span class="name">Period 6</span>
                    <span class="percentage">48.0%</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 48.0%;"></div>
                </div>
            </li>
            

            <li class="row">
                <div class="top-line">
                    <span class="rank">#2</span>
                    <span class="name">Period 4</span>
                    <span class="percentage">45.14%</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 45.14%;"></div>
                </div>
            </li>
            

            <li class="row">
                <div class="top-line">
                    <span class="rank">#3</span>
                    <span class="name">Period 5</span>
                    <span class="percentage">41.52%</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 41.52%;"></div>
                </div>
            </li>
            

            <li class="row">
                <div class="top-line">
                    <span class="rank">#4</span>
                    <span class="name">Period 3</span>
                    <span class="percentage">38.62%</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 38.62%;"></div>
                </div>
            </li>
            
    </ul>
    <p class="last-updated">Last updated 10/2/2026 at 3:20 PM</p>
</body>
</html>
