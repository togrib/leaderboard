<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="300">
<title>AP Precalc - CYUP Completion Leaderboard</title>
<style>
    :root {
        --bg-color: #0f172a;
        --text-color: #f1f5f9;
        --row-bg: #1e293b;
        --rank-color: #94a3b8;
        --bar-track-color: #334155;
        --bar-fill-start: #22d3ee;
        --bar-fill-end: #3b82f6;
    }
    body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 3vh 3vw;
    }
    h1 {
        text-align: center;
        font-size: 4vw;
        margin-bottom: 3vh;
    }
    ul {
        list-style: none;
        margin: 0 auto;
        padding: 0;
        max-width: 90vw;
    }
    .row {
        display: flex;
        align-items: center;
        gap: 2vw;
        padding: 2vh 2vw;
        margin-bottom: 1.5vh;
        background: var(--row-bg);
        border-radius: 12px;
        font-size: 2.2vw;
    }
    .rank {
        width: 4vw;
        font-weight: bold;
        color: var(--rank-color);
    }
    .name {
        width: 16vw;
        font-weight: 600;
    }
    .bar-track {
        flex-grow: 1;
        background: var(--bar-track-color);
        border-radius: 8px;
        overflow: hidden;
        height: 4vh;
    }
    .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--bar-fill-start), var(--bar-fill-end));
    }
    .percentage {
        width: 6vw;
        text-align: right;
        font-weight: bold;
    }
</style>
</head>
<body>
    <h1>AP Precalc - CYUP Completion Leaderboard</h1>
    <ul>
        
            <li class="row">
                <span class="rank">#1</span>
                <span class="name">Period 6</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 0.0%;"></div>
                </div>
                <span class="percentage">0.0%</span>
            </li>
            

            <li class="row">
                <span class="rank">#2</span>
                <span class="name">Period 3</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 0.0%;"></div>
                </div>
                <span class="percentage">0.0%</span>
            </li>
            

            <li class="row">
                <span class="rank">#3</span>
                <span class="name">Period 5</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 0.0%;"></div>
                </div>
                <span class="percentage">0.0%</span>
            </li>
            

            <li class="row">
                <span class="rank">#4</span>
                <span class="name">Period 4</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 0.0%;"></div>
                </div>
                <span class="percentage">0.0%</span>
            </li>
            
    </ul>
</body>
</html>
